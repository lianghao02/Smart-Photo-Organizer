<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智慧照片整理助手 Pro v2.8</title>
  <style>
    :root {
      --bg-primary: #0F172A;
      --bg-card: #1E293B;
      --bg-input: #334155;
      --border-color: #475569;
      --accent-color: #38BDF8;
      --accent-hover: #0284C7;
      --success-color: #22C55E;
      --warning-color: #F59E0B;
      --danger-color: #EF4444;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei UI", sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      padding: 20px;
      user-select: none;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-title h1 {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #38BDF8, #818CF8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .version-badge {
      background-color: rgba(56, 189, 248, 0.15);
      color: var(--accent-color);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .status-badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      background: #334155;
      color: var(--text-muted);
    }
    .status-badge.running { background: rgba(34, 197, 94, 0.2); color: var(--success-color); border: 1px solid var(--success-color); }
    .status-badge.paused { background: rgba(245, 158, 11, 0.2); color: var(--warning-color); border: 1px solid var(--warning-color); }

    /* Cards */
    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--accent-color);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Form controls */
    .path-group {
      display: grid;
      grid-template-columns: 110px 1fr 90px;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .path-group:last-child { margin-bottom: 0; }

    label { font-size: 0.9rem; color: var(--text-main); }

    input[type="text"] {
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: var(--accent-color);
    }

    .btn {
      background-color: var(--bg-input);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:hover:not(:disabled) {
      background-color: var(--border-color);
    }
    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-primary {
      background: linear-gradient(135deg, #0284C7, #2563EB);
      color: white;
      border: none;
    }
    .btn-primary:hover:not(:disabled) {
      background: linear-gradient(135deg, #0369A1, #1D4ED8);
    }

    .btn-warning {
      background-color: rgba(245, 158, 11, 0.2);
      color: var(--warning-color);
      border: 1px solid var(--warning-color);
    }
    .btn-warning:hover:not(:disabled) { background-color: rgba(245, 158, 11, 0.3); }

    .btn-danger {
      background-color: rgba(239, 68, 68, 0.2);
      color: var(--danger-color);
      border: 1px solid var(--danger-color);
    }
    .btn-danger:hover:not(:disabled) { background-color: rgba(239, 68, 68, 0.3); }

    /* Mode Selection */
    .mode-container {
      display: flex;
      gap: 24px;
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 1px dashed var(--border-color);
    }
    .radio-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 0.92rem;
      font-weight: 500;
    }
    input[type="radio"], input[type="checkbox"] {
      accent-color: var(--accent-color);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    /* Core Options Grid */
    .core-options-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 12px;
    }
    .core-column {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .checkbox-label {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      cursor: pointer;
      font-size: 0.88rem;
      line-height: 1.35;
    }
    .checkbox-label.sub-option {
      margin-left: 24px;
      font-size: 0.83rem;
      color: var(--text-muted);
      border-left: 2px solid var(--border-color);
      padding-left: 8px;
    }

    /* Advanced Collapsible Accordion */
    details {
      background-color: rgba(51, 65, 85, 0.4);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 14px;
      transition: all 0.2s ease;
    }
    details[open] {
      background-color: rgba(51, 65, 85, 0.7);
    }
    summary {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 6px;
      outline: none;
    }
    summary:hover {
      color: var(--accent-color);
    }
    .advanced-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px 24px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--border-color);
    }

    /* Controls Bar */
    .controls-bar {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }
    .controls-bar .btn {
      padding: 10px 24px;
      font-size: 0.95rem;
    }

    /* Dashboard & Progress */
    .stats-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 14px;
    }
    .stat-card {
      background-color: var(--bg-input);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }
    .stat-card .label { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; }
    .stat-card .value { font-size: 1.1rem; font-weight: 700; color: var(--accent-color); font-family: monospace; }

    .progress-bar-bg {
      background-color: var(--bg-input);
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .progress-bar-fill {
      background: linear-gradient(90deg, #38BDF8, #818CF8);
      height: 100%;
      width: 0%;
      transition: width 0.2s ease;
    }

    .current-file {
      font-size: 0.82rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 12px;
    }

    /* Terminal Console Log */
    .console-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .console-box {
      background-color: #090D16;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      height: 180px;
      padding: 10px 14px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 0.85rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .log-line { line-height: 1.4; word-break: break-all; }
    .log-info { color: #CBD5E1; }
    .log-warn { color: #FBBF24; }
    .log-error { color: #F87171; }
    .log-success { color: #4ADE80; }
  </style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <div class="header">
    <div class="header-title">
      <h1>✨ 智慧照片整理助手</h1>
      <span class="version-badge">v2.8 (Pro Web)</span>
    </div>
    <div id="statusBadge" class="status-badge">靜候中</div>
  </div>

  <!-- Paths -->
  <div class="card">
    <div class="card-title">📂 資料夾路徑設定</div>
    <div class="path-group">
      <label>來源資料夾：</label>
      <input type="text" id="sourceDir" placeholder="請選擇包含照片的來源資料夾...">
      <button class="btn" onclick="selectSourceFolder()">瀏覽...</button>
    </div>
    <div class="path-group">
      <label>目標資料夾：</label>
      <input type="text" id="destDir" placeholder="請選擇整理後存放的目標資料夾...">
      <button class="btn" id="btnBrowseDest" onclick="selectDestFolder()">瀏覽...</button>
    </div>
  </div>

  <!-- Mode & Options -->
  <div class="card">
    <div class="card-title">⚙️ 整理模式與規則</div>

    <!-- Mode radios -->
    <div class="mode-container">
      <label class="radio-label">
        <input type="radio" name="mode" value="copy" checked onchange="onModeChange()"> 複製照片 (Copy)
      </label>
      <label class="radio-label">
        <input type="radio" name="mode" value="move" onchange="onModeChange()"> 移動照片 (Move)
      </label>
      <label class="radio-label">
        <input type="radio" name="mode" value="cleanup" onchange="onModeChange()"> 原地清理 (Cleanup)
      </label>
    </div>

    <!-- Core Options (3 Columns) -->
    <div class="core-options-grid">
      <!-- Col 1: Screenshot -->
      <div class="core-column">
        <label class="checkbox-label">
          <input type="checkbox" id="smartScreenshot" checked onchange="onSmartScreenshotChange()"> 📱 自動隔離螢幕截圖 (移至 _Screenshots)
        </label>
        <label class="checkbox-label sub-option">
          <input type="checkbox" id="screenshotStrict" checked> 僅抓取手機直式截圖 (避免誤判網路梗圖)
        </label>
      </div>

      <!-- Col 2: Rename -->
      <div class="core-column">
        <label class="checkbox-label">
          <input type="checkbox" id="renameEnabled"> 🔢 依拍攝時間重新命名 (001.jpg, 002.jpg...)
        </label>
      </div>

      <!-- Col 3: GPS -->
      <div class="core-column">
        <label class="checkbox-label">
          <input type="checkbox" id="gpsEnabled"> 🗺️ 依拍照地點建資料夾 (如：台灣_台北市)
        </label>
      </div>
    </div>

    <!-- Advanced Collapsible Section -->
    <details>
      <summary>⚙️ 進階與安全設定 (預設已為您開啟最安全防護，點擊展開調整)</summary>
      <div class="advanced-grid">
        <label class="checkbox-label">
          <input type="checkbox" id="onedriveProtect" checked> ☁️ OneDrive 省流量防護 (防止自動觸發大量下載)
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="skipExisting"> 👯 跳過已存在的重複照片 (避免檔案重複)
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="resumeEnabled" checked> 💾 自動記錄進度 (中斷後重新開啟可接著整理)
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="dryRun"> 🧪 模擬測試模式 (不搬移任何檔案，僅產出報表)
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="blurCheck"> 🔍 自動挑出模糊照片 (隔離至 _Blurry 資料夾)
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="cleanEmpty"> 🧹 自動清理搬空的舊資料夾
        </label>
      </div>
    </details>
  </div>

  <!-- Controls -->
  <div class="controls-bar">
    <button class="btn btn-primary" id="btnStart" onclick="startProcess()">▶ 開始整理</button>
    <button class="btn btn-warning" id="btnPause" disabled onclick="togglePause()">⏸ 暫停</button>
    <button class="btn btn-danger" id="btnStop" disabled onclick="stopProcess()">⏹ 停止</button>
  </div>

  <!-- Dashboard & Log -->
  <div class="card">
    <div class="card-title">📊 即時監控儀表板</div>
    <div class="stats-cards">
      <div class="stat-card">
        <div class="label">傳輸速度</div>
        <div class="value" id="lblSpeed">0.0 MB/s</div>
      </div>
      <div class="stat-card">
        <div class="label">預估剩餘時間</div>
        <div class="value" id="lblEta">--</div>
      </div>
      <div class="stat-card">
        <div class="label">處理容量進度</div>
        <div class="value" id="lblSizeProg">0 MB / 0 MB</div>
      </div>
    </div>

    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
    <div class="current-file" id="lblCurrent">等待開始...</div>

    <div class="console-header">
      <label style="font-weight: 600; font-size: 0.85rem;">執行日誌 Console：</label>
      <button class="btn" style="padding: 2px 8px; font-size: 0.75rem;" onclick="clearLog()">清空日誌</button>
    </div>
    <div class="console-box" id="consoleBox">
      <div class="log-line log-info">🚀 系統準備就緒，請設定資料夾後點擊「開始整理」。</div>
    </div>
  </div>
</div>

<script>
  let isRunning = false;
  let isPaused = false;

  window.addEventListener('pywebviewready', function() {
    pywebview.api.get_initial_config().then(config => {
      if (config) {
        document.getElementById('sourceDir').value = config.source_dir || '';
        document.getElementById('destDir').value = config.dest_dir || '';
        document.getElementById('skipExisting').checked = config.skip_existing || false;
      }
    });

    setInterval(pollUpdates, 200);
  });

  function pollUpdates() {
    if (!window.pywebview || !pywebview.api) return;
    pywebview.api.get_updates().then(data => {
      if (!data) return;
      
      if (data.logs && data.logs.length > 0) {
        data.logs.forEach(item => {
          appendLog(item.msg, item.level);
        });
      }
      
      if (data.progress) {
        updateProgress(data.progress);
      }

      if (data.finished_msg) {
        onProcessFinished(data.finished_msg);
      }
    }).catch(err => {});
  }

  function checkPyWebview() {
    if (!window.pywebview || !pywebview.api) {
      alert("⚠️ 請透過雙擊 start_organizer.bat 或執行 python main.py 啟動程式，方可選取本機資料夾！");
      return false;
    }
    return true;
  }

  function selectSourceFolder() {
    if (!checkPyWebview()) return;
    pywebview.api.select_source_folder().then(folder => {
      if (folder) document.getElementById('sourceDir').value = folder;
    });
  }

  function selectDestFolder() {
    if (!checkPyWebview()) return;
    pywebview.api.select_dest_folder().then(folder => {
      if (folder) document.getElementById('destDir').value = folder;
    });
  }

  function onModeChange() {
    const mode = document.querySelector('input[name="mode"]:checked').value;
    const destInput = document.getElementById('destDir');
    const btnBrowseDest = document.getElementById('btnBrowseDest');
    if (mode === 'cleanup') {
      destInput.disabled = true;
      btnBrowseDest.disabled = true;
    } else {
      destInput.disabled = false;
      btnBrowseDest.disabled = false;
    }
  }

  function onSmartScreenshotChange() {
    const isChecked = document.getElementById('smartScreenshot').checked;
    const strict = document.getElementById('screenshotStrict');
    strict.disabled = !isChecked;
    if (!isChecked) strict.checked = false;
  }

  function getConfigPayload() {
    return {
      source_dir: document.getElementById('sourceDir').value,
      dest_dir: document.getElementById('destDir').value,
      mode: document.querySelector('input[name="mode"]:checked').value,
      clean_empty: document.getElementById('cleanEmpty').checked,
      rename_enabled: document.getElementById('renameEnabled').checked,
      gps_enabled: document.getElementById('gpsEnabled').checked,
      resume_enabled: document.getElementById('resumeEnabled').checked,
      blur_check_enabled: document.getElementById('blurCheck').checked,
      skip_existing: document.getElementById('skipExisting').checked,
      dry_run: document.getElementById('dryRun').checked,
      smart_screenshot: document.getElementById('smartScreenshot').checked,
      screenshot_strict_mode: document.getElementById('screenshotStrict').checked,
      onedrive_protect: document.getElementById('onedriveProtect').checked
    };
  }

  function startProcess() {
    if (!checkPyWebview()) return;
    const config = getConfigPayload();
    if (!config.source_dir) {
      alert("請選擇來源資料夾！");
      return;
    }
    if (config.mode !== 'cleanup' && !config.dest_dir) {
      alert("請選擇目標資料夾！");
      return;
    }

    setUiState(true);
    pywebview.api.start_process(config).then(res => {
      if (res && res.error) {
        alert(res.error);
        setUiState(false);
      }
    });
  }

  function togglePause() {
    if (!checkPyWebview()) return;
    if (!isPaused) {
      pywebview.api.pause_process().then(() => {
        isPaused = true;
        document.getElementById('btnPause').textContent = "▶ 繼續";
        updateStatus("已暫停", "paused");
      });
    } else {
      pywebview.api.resume_process().then(() => {
        isPaused = false;
        document.getElementById('btnPause').textContent = "⏸ 暫停";
        updateStatus("整理中", "running");
      });
    }
  }

  function stopProcess() {
    if (!checkPyWebview()) return;
    if (confirm("確定要停止目前的任務嗎？")) {
      pywebview.api.stop_process().then(() => {
        setUiState(false);
        updateStatus("靜候中", "");
      });
    }
  }

  function setUiState(running) {
    isRunning = running;
    isPaused = false;
    document.getElementById('btnStart').disabled = running;
    document.getElementById('btnPause').disabled = !running;
    document.getElementById('btnStop').disabled = !running;
    document.getElementById('btnPause').textContent = "⏸ 暫停";
    updateStatus(running ? "整理中" : "靜候中", running ? "running" : "");
  }

  function updateStatus(text, className) {
    const badge = document.getElementById('statusBadge');
    badge.textContent = text;
    badge.className = "status-badge " + className;
  }

  function updateProgress(data) {
    const total = parseInt(data.total);
    const current = parseInt(data.current);
    const percent = total > 0 ? ((current / total) * 100).toFixed(1) : 0;
    
    document.getElementById('progressBar').style.width = percent + "%";
    document.getElementById('lblCurrent').textContent = "正在處理: " + data.filename;

    if (data.speed !== undefined) {
      const speedMB = (parseFloat(data.speed) / (1024 * 1024)).toFixed(1);
      document.getElementById('lblSpeed').textContent = speedMB + " MB/s";
    }

    if (data.eta !== undefined) {
      const eta = parseInt(data.eta);
      const m = Math.floor(eta / 60);
      const s = eta % 60;
      const h = Math.floor(m / 60);
      document.getElementById('lblEta').textContent = h > 0 ? `${h}h ${m % 60}m` : `${m}m ${s}s`;
    }

    if (data.processed_size !== undefined && data.total_size !== undefined) {
      document.getElementById('lblSizeProg').textContent = `${fmtSize(data.processed_size)} / ${fmtSize(data.total_size)}`;
    }
  }

  function appendLog(msg, level) {
    const box = document.getElementById('consoleBox');
    const div = document.createElement('div');
    div.className = "log-line log-" + (level || 'info');
    div.textContent = msg;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  function onProcessFinished(msg) {
    setUiState(false);
    if (msg) alert(msg);
  }

  function clearLog() {
    document.getElementById('consoleBox').innerHTML = '';
  }

  function fmtSize(bytes) {
    let size = parseFloat(bytes);
    const units = ['B', 'KB', 'MB', 'GB', 'TB'];
    for (let u of units) {
      if (size < 1024.0) return `${size.toFixed(1)} ${u}`;
      size /= 1024.0;
    }
    return `${size.toFixed(1)} PB`;
  }
</script>
</body>
</html>

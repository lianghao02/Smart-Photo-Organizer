[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-photo-organizer"
version = "3.2.0"
description = "以人工審核為核心的本機照片與 Google Takeout 整理工具"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pywebview",
    "Pillow",
    "pillow-heif",
    "geopy",
    "pystray",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["smart_photo_organizer*"]
